nameOverride: ""
fullnameOverride: ""
image:
  repository: "227281812993.dkr.ecr.us-east-2.amazonaws.com/lesson-7-django" # Updated by Jenkins
  tag: fea9e0c3973a
  pullPolicy: IfNotPresent
replicaCount: 2
service:
  type: LoadBalancer
  port: 80
  targetPort: 8000
config:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*" # For temporary lab access; restrict for production.
  POSTGRES_DB: "neoversity_db"
  POSTGRES_USER: "dbadmin"
  POSTGRES_HOST: "neoversity-final-db.cr60u4oi4vf1.us-east-2.rds.amazonaws.com"
  POSTGRES_PORT: "5432"
secretName: "django-rds-secrets"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
postgresql:
  enabled: true
  image: postgres:16-alpine
  # emptyDir is ephemeral; strictly for short-lived coursework only.
  storage: ephemeral
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
ingress:
  enabled: false
  className: nginx
  host: example.com
  path: /
  pathType: Prefix
  tls: false
  tlsSecretName: django-app-tls
  clusterIssuer: letsencrypt-prod
